name: NFS pynfs gate

# Pinned external-suite run for issue #51. pynfs speaks raw RPC to the conformance fixture on
# loopback, so this needs no mount or sudo and runs on every pull request that can change the
# NFS server's wire behavior. The verdict is the comparison with the classified
# apps/nfs-preview/conformance/known-failures.json, not the suite's own pass count.

on:
  workflow_dispatch:
  pull_request:
    paths:
      - packages/core/**
      - packages/nfs/**
      - apps/nfs-preview/**
      - .github/workflows/nfs-pynfs.yml

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pynfs:
    name: pynfs NFSv4.1
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.21
      # pynfs needs xdrlib3; the recorded baseline ran on Python 3.14.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: bun install --frozen-lockfile
      # The fixture imports the workspace packages by their published entry points.
      - run: bunx turbo run build --filter=@effect-vfs/nfs
      - name: Run the pynfs gate
        run: bun run --filter @repo/nfs-preview pynfs-gate
