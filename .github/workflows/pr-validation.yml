name: PR validation

on:
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.21
      - run: bun install --frozen-lockfile
      - run: bun run format:check
      # Workspace packages export declarations from dist/. Build them before
      # Oxlint resolves their package imports during type-aware analysis.
      - run: bun run build
      # The docs prebuild hook regenerates the API reference during `build`, so a
      # dirty tree here means the committed reference is stale.
      - name: Verify API reference is up to date
        run: |
          if [ -n "$(git status --porcelain apps/docs/app/content/api)" ]; then
            git diff -- apps/docs/app/content/api
            echo "::error::API reference is stale. Run 'bun run docs:check' and commit the result."
            exit 1
          fi
      - run: bun run lint
      - run: bun run lint:effects
      - run: bun run type-check
      - run: bun run test
      - name: Benchmark correctness smoke
        env:
          CONFINEMENT_BENCH_DEPTHS: "1,8"
          CONFINEMENT_BENCH_ITERATIONS: "3"
          CONFINEMENT_BENCH_ROUNDS: "2"
          CONFINEMENT_BENCH_BASELINE_CONFINED: "1"
          XDR_BENCH_TIME_MS: "5"
          XDR_BENCH_ITERATIONS: "2"
          XDR_BENCH_ROUNDS: "2"
        run: |
          bun run --cwd packages/core benchmark
          bun run --cwd packages/nfs benchmark

  filesystem-host:
    name: FileSystem contract, Node 24.21.0 / Ubuntu 24.04
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.21
      - uses: actions/setup-node@v4
        with:
          node-version: 24.21.0
      - run: bun install --frozen-lockfile
      - name: Identify host configuration
        run: |
          node --version
          uname -a
          cat /etc/os-release
          node -p "require('@effect/platform-node-shared/package.json').version"
      - run: bun run --filter @effect-vfs/core build
      - run: bun run --filter @effect-vfs/memory test:host
      - run: bun run --filter @effect-vfs/nfs build
      - name: Node benchmark correctness smoke
        env:
          CONFINEMENT_BENCH_DEPTHS: "1,8"
          CONFINEMENT_BENCH_ITERATIONS: "3"
          CONFINEMENT_BENCH_ROUNDS: "2"
          CONFINEMENT_BENCH_BASELINE_CONFINED: "1"
          XDR_BENCH_TIME_MS: "5"
          XDR_BENCH_ITERATIONS: "2"
          XDR_BENCH_ROUNDS: "2"
        run: |
          node node_modules/vitest/vitest.mjs bench --run --config vitest.config.ts --project 'core (bench)' --project 'nfs (bench)'
