name: PR validation

on:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - run: bun run validate
      - name: Benchmark correctness smoke
        env:
          CONFINEMENT_BENCH_DEPTHS: "1,8"
          CONFINEMENT_BENCH_ITERATIONS: "3"
          CONFINEMENT_BENCH_ROUNDS: "2"
          CONFINEMENT_BENCH_BASELINE_CONFINED: "1"
          XDR_BENCH_TIME_MS: "5"
          XDR_BENCH_ITERATIONS: "2"
          XDR_BENCH_ROUNDS: "2"
        run: |
          bun run --cwd packages/core benchmark
          bun run --cwd packages/nfs benchmark

  filesystem-host:
    name: FileSystem contract, Node 24.21.0 / Ubuntu 24.04
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.21.0
      - run: bun install --frozen-lockfile
      - name: Identify host configuration
        run: |
          node --version
          uname -a
          cat /etc/os-release
          node -p "require('@effect/platform-node-shared/package.json').version"
      - run: bun run build --filter=@effect-vfs/core
      - run: bun run --cwd packages/core test:packed
      - run: bun run --filter @effect-vfs/memory test:host
      - run: bun run --filter @effect-vfs/nfs build
      - name: Node benchmark correctness smoke
        env:
          CONFINEMENT_BENCH_DEPTHS: "1,8"
          CONFINEMENT_BENCH_ITERATIONS: "3"
          CONFINEMENT_BENCH_ROUNDS: "2"
          CONFINEMENT_BENCH_BASELINE_CONFINED: "1"
          XDR_BENCH_TIME_MS: "5"
          XDR_BENCH_ITERATIONS: "2"
          XDR_BENCH_ROUNDS: "2"
        run: |
          node node_modules/vitest/vitest.mjs bench --run --config vitest.config.ts --project 'core (bench)' --project 'nfs (bench)'

  node-vfs-provider:
    name: Direct VirtualProvider, Node 26.11.1
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - uses: actions/setup-node@v4
        with:
          node-version: 26.11.1
      - run: bun install --frozen-lockfile
      - run: node --version
      - run: bun run build --filter=@effect-vfs/node
      - run: bun run test:node

  node-vfs-mounted:
    name: Mounted fs, streams and loaders, Node 26.11.1
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - uses: actions/setup-node@v4
        with:
          node-version: 26.11.1
      - run: bun install --frozen-lockfile
      - name: Identify qualification candidate
        run: |
          node --version
          uname -a
          git rev-parse HEAD
          node -p "require('effect/package.json').version"
      - run: bun run build --filter=@effect-vfs/node
      - run: bun run --cwd packages/node test:mounted

  typescript-workbench:
    name: TypeScript workbench, Node 26.11.1
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - uses: actions/setup-node@v4
        with:
          node-version: 26.11.1
      - run: bun install --frozen-lockfile
      - run: bun run build --filter=@repo/typescript-workbench
      - run: bun run --cwd apps/demo-typescript-workbench test

  postgres-live-images:
    name: PostgreSQL 18.3 live images, Bun 1.4.4
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18.3
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: vfs_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d vfs_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      VFS_PG_TEST_URL: postgresql://postgres:postgres@127.0.0.1:5432/vfs_test
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - run: bun run build --filter=@effect-vfs/persistence
      - name: Provision the explicit schema
        run: psql "$VFS_PG_TEST_URL" -v ON_ERROR_STOP=1 -f packages/persistence/migrations/postgresql/001_live_images.sql
      - name: Enable TLS with a disposable test certificate
        env:
          POSTGRES_CONTAINER: ${{ job.services.postgres.id }}
        run: |
          openssl req -x509 -newkey rsa:2048 -nodes -days 1 -subj /CN=localhost -addext 'subjectAltName=IP:127.0.0.1,DNS:localhost' -keyout "$RUNNER_TEMP/vfs-pg.key" -out "$RUNNER_TEMP/vfs-pg.crt"
          docker cp "$RUNNER_TEMP/vfs-pg.key" "$POSTGRES_CONTAINER:/tmp/vfs-pg.key"
          docker cp "$RUNNER_TEMP/vfs-pg.crt" "$POSTGRES_CONTAINER:/tmp/vfs-pg.crt"
          docker exec "$POSTGRES_CONTAINER" chown postgres:postgres /tmp/vfs-pg.key /tmp/vfs-pg.crt
          docker exec "$POSTGRES_CONTAINER" chmod 600 /tmp/vfs-pg.key
          psql "$VFS_PG_TEST_URL" -v ON_ERROR_STOP=1 -c "ALTER SYSTEM SET ssl_cert_file = '/tmp/vfs-pg.crt'" -c "ALTER SYSTEM SET ssl_key_file = '/tmp/vfs-pg.key'" -c 'ALTER SYSTEM SET ssl = on' -c 'SELECT pg_reload_conf()'
      - name: Run PostgreSQL contracts including verified TLS
        run: VFS_PG_TEST_CA="$(cat "$RUNNER_TEMP/vfs-pg.crt")" bun run --cwd packages/persistence test:pg
